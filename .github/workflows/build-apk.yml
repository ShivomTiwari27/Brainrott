name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon > gradle_output.txt 2>&1 || true
        tail -n 60 gradle_output.txt

    - name: Publish Result
      if: github.ref == 'refs/heads/main'
      run: |
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "APK_EXISTS=true" >> $GITHUB_ENV
        else
          echo "APK_EXISTS=false" >> $GITHUB_ENV
          grep -C 4 -i "error:" gradle_output.txt > release_body.txt || tail -n 80 gradle_output.txt > release_body.txt
        fi

    - name: Create Failure Release with Log
      if: env.APK_EXISTS == 'false'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.4
        name: "Build Failure Debug Log"
        body_path: release_body.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Success Release with APK
      if: env.APK_EXISTS == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.5
        name: "BrainRot Killer v1.0.5 (Direct APK Download)"
        body: |
          ### 🧠 BrainRot Killer APK
          Download the **`app-debug.apk`** below directly to your Android device and tap to install!
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Debug APK Artifact
      if: env.APK_EXISTS == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: BrainRotKiller-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 14

    - name: Fail Job if APK Missing
      if: env.APK_EXISTS == 'false'
      run: exit 1
