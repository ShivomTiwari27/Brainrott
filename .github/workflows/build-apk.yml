name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

    - name: Commit log on failure
      if: failure()
      run: |
        git checkout -b build-logs
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add build.log
        git commit -m "Build failure log"
        git push -f origin build-logs

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BrainRotKiller-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14

    - name: Create GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.1
        name: "BrainRot Killer v1.0.1 (Direct APK Download)"
        body: |
          ### 🧠 BrainRot Killer APK
          Download the **`app-debug.apk`** below directly to your Android device and tap to install!
        files: |
          app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
